<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>天使落地指引卡</title>
<link rel="stylesheet" href="angel-style.css" />
</head>
<body>
  <div class="app">
    <nav class="site-nav">
      <a class="nav-link" href="index.html">🔮 塔羅牌抽牌</a>
      <a class="nav-link" href="pantheon.html">⚡ 萬神歸途指引卡</a>
      <a class="nav-link" href="innerstudio.html">🎬 內在片場神諭卡</a>
      <a class="nav-link" href="innerchild.html">🧸 童年碎片拾光卡</a>
      <a class="nav-link" href="dailylight.html">🌤️ 日日微光指引卡</a>
    </nav>

    <header class="header">
      <h1>🕊️ 天使落地指引卡</h1>
      <p class="subtitle">44 張「天使落地指引卡」，抽一張獲得當下的具體指引，或抽三張看見更完整的脈絡（沒有正逆位）</p>
      <p class="visit-counter" id="visitCounter" hidden>已被瀏覽 <span id="visitCount">–</span> 次</p>
    </header>

    <section class="controls" id="controls">
      <div class="draw-choice">
        <button type="button" class="draw-btn active" data-count="1">
          <span class="count">1</span>單張指引
        </button>
        <button type="button" class="draw-btn" data-count="3">
          <span class="count">3</span>三張指引
        </button>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="shuffleBtn">🕊️ 洗牌並抽牌</button>
        <button type="button" class="btn-secondary" id="revealAllBtn" disabled>翻開全部</button>
        <button type="button" class="btn-secondary" id="resetBtn" disabled>重新開始</button>
      </div>
    </section>

    <section class="status" id="deckStatus" hidden>
      <div class="shuffle-anim">
        <div class="shuffle-card c1"></div>
        <div class="shuffle-card c2"></div>
        <div class="shuffle-card c3"></div>
      </div>
      <p id="statusText">洗牌中…</p>
    </section>

    <section class="reading" id="reading" hidden>
      <div class="card-grid" id="spreadGrid"></div>
    </section>

    <footer class="note">點一次翻牌，再點一次查看完整落地指引</footer>
  </div>

  <div class="overlay" id="detailOverlay" hidden>
    <div class="detail-card" id="cardDetail"></div>
  </div>

  <script src="angel-cards.js"></script>
  <script src="angel-app.js"></script>
</body>
</html>
