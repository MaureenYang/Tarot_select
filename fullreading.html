<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>完整解讀</title>
<link rel="stylesheet" href="fullreading-style.css" />
</head>
<body>
  <div class="app">
    <nav class="site-nav">
      <a class="nav-link" href="index.html">🔮 塔羅牌抽牌</a>
      <a class="nav-link" href="innerchild.html">🧸 童年碎片拾光卡</a>
      <a class="nav-link" href="innerstudio.html">🎬 內在片場神諭卡</a>
      <a class="nav-link" href="pantheon.html">⚡ 萬神歸途指引卡</a>
      <a class="nav-link" href="angel.html">🕊️ 天使落地指引卡</a>
      <a class="nav-link" href="dailylight.html">🌤️ 日日微光指引卡</a>
      <a class="nav-link" href="about.html">✦ 關於牌卡</a>
    </nav>

    <header class="header">
      <h1>🌌 完整解讀</h1>
      <p class="subtitle">一次抽完塔羅牌、童年碎片拾光卡、內在片場神諭卡、萬神歸途指引卡、天使落地指引卡</p>
      <p class="subtitle small">抽完後會產生一份完整的分析指令文字，複製貼給 AI 就能開始解讀</p>
    </header>

    <section class="controls" id="controls">
      <div class="control-group spread-field">
        <label>塔羅牌陣</label>
        <div class="spread-row" id="spreadRow">
          <button type="button" class="spread-btn" data-key="single">
            <span class="spread-count">1</span>
            <span class="spread-name">單張指引</span>
          </button>
          <button type="button" class="spread-btn active" data-key="three">
            <span class="spread-count">3</span>
            <span class="spread-name">過去現在未來</span>
          </button>
          <button type="button" class="spread-btn" data-key="choice">
            <span class="spread-count">5</span>
            <span class="spread-name">二擇一</span>
          </button>
          <button type="button" class="spread-btn" data-key="celtic">
            <span class="spread-count">10</span>
            <span class="spread-name">凱爾特十字</span>
          </button>
          <button type="button" class="spread-btn" data-key="custom">
            <span class="spread-count">?</span>
            <span class="spread-name">自訂張數</span>
          </button>
        </div>
      </div>

      <div class="control-group custom-count-field" id="customCountField" hidden>
        <label for="customCount">選擇張數</label>
        <div class="count-row">
          <button type="button" class="step-btn" id="decreaseBtn" aria-label="減少張數">−</button>
          <input type="number" id="customCount" min="1" max="20" value="4" />
          <button type="button" class="step-btn" id="increaseBtn" aria-label="增加張數">＋</button>
        </div>
      </div>

      <div class="control-group toggle-group">
        <label class="switch-label">
          <input type="checkbox" id="allowReversed" checked />
          <span>塔羅牌包含逆位</span>
        </label>
      </div>

      <div class="control-group oracle-count-field">
        <label>四組神諭卡各抽幾張</label>
        <div class="draw-choice" id="oracleChoice">
          <button type="button" class="draw-btn active" data-count="1">1 張</button>
          <button type="button" class="draw-btn" data-count="3">3 張</button>
        </div>
      </div>

      <div class="control-group question-field">
        <label for="questionInput">你的問題（選填，會放進最後的文字裡）</label>
        <textarea class="question-input" id="questionInput" placeholder="例如：我該不該接受這份新工作？"></textarea>
      </div>

      <div class="control-group actions">
        <button type="button" class="primary-btn" id="drawBtn">🔮 一次抽完五套牌</button>
        <button type="button" class="secondary-btn" id="resetBtn" disabled>重新開始</button>
      </div>
    </section>

    <section class="deck-status" id="deckStatus" hidden>
      <div class="shuffle-anim">
        <div class="shuffle-card c1"></div>
        <div class="shuffle-card c2"></div>
        <div class="shuffle-card c3"></div>
      </div>
      <p id="statusText">洗牌中…</p>
    </section>

    <section class="reading" id="reading" hidden>
      <div class="group-block">
        <h2 class="group-title">🔮 塔羅牌</h2>
        <p class="group-sub" id="tarotSub"></p>
        <div class="card-list" id="tarotList"></div>
      </div>

      <div class="group-block">
        <h2 class="group-title">🧸 童年碎片拾光卡</h2>
        <p class="group-sub">根源：它從哪裡來</p>
        <div class="card-list" id="childList"></div>
      </div>

      <div class="group-block">
        <h2 class="group-title">🎬 內在片場神諭卡</h2>
        <p class="group-sub">現況：現在怎麼運作</p>
        <div class="card-list" id="studioList"></div>
      </div>

      <div class="group-block">
        <h2 class="group-title">⚡ 萬神歸途指引卡</h2>
        <p class="group-sub">轉化：可以怎麼改變</p>
        <div class="card-list" id="pantheonList"></div>
      </div>

      <div class="group-block">
        <h2 class="group-title">🕊️ 天使落地指引卡</h2>
        <p class="group-sub">實踐：接下來怎麼走</p>
        <div class="card-list" id="angelList"></div>
      </div>

      <div class="group-block text-block" id="textBlock">
        <h2 class="text-title">完整解讀文字 <span class="text-hint">複製後貼給 AI，請它依此完整分析</span></h2>
        <textarea class="result-textarea" id="resultText" readonly rows="14"></textarea>
        <button type="button" class="secondary-btn" id="copyTextBtn">📋 複製文字</button>
      </div>
    </section>
  </div>

  <script src="cards.js"></script>
  <script src="innerchild-cards.js"></script>
  <script src="innerstudio-cards.js"></script>
  <script src="pantheon-cards.js"></script>
  <script src="angel-cards.js"></script>
  <script src="fullreading-app.js"></script>
</body>
</html>
