<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔羅牌抽牌</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <nav class="site-nav">
      <a class="nav-link" href="angel.html">🕊️ 天使指引卡</a>
      <a class="nav-link" href="pantheon.html">⚡ 萬神歸途指引卡</a>
      <a class="nav-link" href="innerstudio.html">🎬 內在片場神諭卡</a>
      <a class="nav-link" href="innerchild.html">🧸 未完的童年碎片</a>
      <a class="nav-link" href="dailylight.html">🌤️ 日日微光</a>
    </nav>

    <header class="header">
      <h1>🔮 塔羅牌抽牌</h1>
      <p class="subtitle">選擇牌陣，洗牌後依牌陣排列成對應陣型，並會額外抽出一張底牌</p>
      <p class="visit-counter" id="visitCounter" hidden>已被瀏覽 <span id="visitCount">–</span> 次</p>
    </header>

    <section class="controls" id="controls">
      <div class="control-group spread-field">
        <label>選擇牌陣</label>
        <div class="spread-row" id="spreadRow">
          <button type="button" class="spread-btn" data-key="single">
            <span class="spread-count">1</span>
            <span class="spread-name">單張指引</span>
          </button>
          <button type="button" class="spread-btn active" data-key="three">
            <span class="spread-count">3</span>
            <span class="spread-name">過去現在未來</span>
          </button>
          <button type="button" class="spread-btn" data-key="choice">
            <span class="spread-count">5</span>
            <span class="spread-name">二擇一</span>
          </button>
          <button type="button" class="spread-btn" data-key="celtic">
            <span class="spread-count">10</span>
            <span class="spread-name">凱爾特十字</span>
          </button>
          <button type="button" class="spread-btn" data-key="custom">
            <span class="spread-count">?</span>
            <span class="spread-name">自訂張數</span>
          </button>
        </div>
      </div>

      <div class="control-group custom-count-field" id="customCountField" hidden>
        <label for="customCount">選擇張數</label>
        <div class="count-row">
          <button type="button" class="step-btn" id="decreaseBtn" aria-label="減少張數">−</button>
          <input type="number" id="customCount" min="1" max="20" value="4" />
          <button type="button" class="step-btn" id="increaseBtn" aria-label="增加張數">＋</button>
        </div>
      </div>

      <div class="control-group toggle-group">
        <label class="switch-label">
          <input type="checkbox" id="allowReversed" checked />
          <span>包含逆位牌</span>
        </label>
        <label class="switch-label">
          <input type="checkbox" id="includeBase" checked />
          <span>額外抽一張底牌</span>
        </label>
      </div>

      <div class="control-group actions">
        <button type="button" class="primary-btn" id="shuffleBtn">🃏 洗牌並抽牌</button>
        <button type="button" class="secondary-btn" id="revealAllBtn" disabled>翻開全部</button>
        <button type="button" class="secondary-btn" id="resetBtn" disabled>重新開始</button>
      </div>
    </section>

    <section class="deck-status" id="deckStatus" hidden>
      <div class="shuffle-anim" id="shuffleAnim">
        <div class="shuffle-card c1"></div>
        <div class="shuffle-card c2"></div>
        <div class="shuffle-card c3"></div>
      </div>
      <p id="statusText">洗牌中…</p>
    </section>

    <section class="reading" id="reading" hidden>
      <div class="reading-block">
        <h2 class="block-title">牌陣</h2>
        <div class="card-grid" id="spreadGrid"></div>
      </div>

      <div class="reading-block base-block" id="baseBlock" hidden>
        <h2 class="block-title">底牌 <span class="hint">代表整體潛藏的核心能量</span></h2>
        <div class="card-grid base-grid" id="baseGrid"></div>
      </div>
    </section>

    <div class="card-detail-overlay" id="detailOverlay" hidden>
      <div class="card-detail" id="cardDetail"></div>
    </div>
  </div>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
